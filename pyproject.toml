[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "security-txt-checker"
version = "0.3.0"
description = "Retrieve and validate a public security.txt file without following redirects."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Oscar Opemba" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/Oscar-Opemba/security-txt-checker"
Issues = "https://github.com/Oscar-Opemba/security-txt-checker/issues"

[project.scripts]
security-txt-checker = "app:main"

[tool.setuptools]
py-modules = ["app", "common", "security_utils"]
